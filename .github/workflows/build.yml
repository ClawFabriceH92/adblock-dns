name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests et APK de développement
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests unitaires du moteur (module core)
        run: ./gradlew :core:test

      - name: Test de bout en bout sur une interface TUN Linux
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet dnspython
          ./gradlew :core:writeTestClasspath
          sudo env "PATH=$PATH" .venv/bin/python tools/test_tun_linux.py

      - name: Compilation Android et tests unitaires de l'application
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Lint Android
        run: ./gradlew :app:lintDebug

      - name: Tests contre les vrais services (listes publiques, DoH Cloudflare et Quad9)
        # Dépend de services tiers : un échec ici est signalé sans bloquer la construction.
        continue-on-error: true
        run: ./gradlew :core:test -PnetworkTests=true --tests '*Real*'

      - uses: actions/upload-artifact@v6
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rapports
          path: |
            core/build/reports/tests/
            app/build/reports/
            app/schemas/
          if-no-files-found: ignore

  emulateur:
    name: Test sur émulateur Android (VPN réel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: apk-debug
          path: apk

      - name: Activer KVM (accélération matérielle de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur API 34, activation de la protection et vérification du blocage DNS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 tools/test_emulateur.py apk/app-debug.apk

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: captures-emulateur
          path: build/captures-emulateur/
          if-no-files-found: ignore

  release:
    name: Release signée
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Version tirée du tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Le tag doit être de la forme vX.Y.Z (reçu : $GITHUB_REF_NAME)"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          ADBLOCK_KEYSTORE_BASE64: ${{ secrets.ADBLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ADBLOCK_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ADBLOCK_KEYSTORE_BASE64 absent : la release ne peut pas être signée (voir README)."
            exit 1
          fi
          echo "$ADBLOCK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ADBLOCK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK release signé
        env:
          ADBLOCK_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCK_KEYSTORE_PASSWORD }}
          ADBLOCK_KEY_ALIAS: ${{ secrets.ADBLOCK_KEY_ALIAS }}
          ADBLOCK_KEY_PASSWORD: ${{ secrets.ADBLOCK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - name: Nom versionné et vérification de la signature
        run: |
          NAME="AdBlockDns_$(date -u +%Y-%m-%d)_v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Publication de la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$APK_NAME.sha256" \
            --title "Bloqueur DNS $GITHUB_REF_NAME" --generate-notes
